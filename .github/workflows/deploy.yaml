name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Quran page SVGs are gitignored; they live as a release asset (tag `svg-data`).
      - name: Download Quran SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download svg-data --pattern hafs-kfqc-svg.zip --repo "$GITHUB_REPOSITORY"
          mkdir -p static/hafs-svg
          unzip -q hafs-kfqc-svg.zip -d static/hafs-svg
          rm hafs-kfqc-svg.zip
          test "$(ls static/hafs-svg/svg | wc -l)" -eq 722

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          echo $BASE_PATH && npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
